# Je déclare ici mon projet : son nom, sa version, la version de Python
# et, au fil des étapes, ses dépendances (que j'ajoute avec « uv add »)
# ainsi que la configuration de mes outils.

[project]
name = "p5-deploiement-ml"
version = "0.1.0"
description = "API de prédiction du départ des employés (POC Futurisys)"
readme = "README.md"
authors = [{ name = "Angèle Gomis Mendy" }]
# Je reste sur Python 3.11 : c'est la version avec laquelle le modèle du P4
# a été entraîné, je garde donc exactement le même environnement.
requires-python = ">=3.11,<3.12"
dependencies = []

# J'installe mon code comme un paquet : « from src import config » fonctionne
# depuis l'API, les scripts et les tests, sans toucher au PYTHONPATH.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Mon paquet s'appelle src, comme dans mon modèle de projet et au P4.
[tool.hatch.build.targets.wheel]
packages = ["src"]