
name: CI - Qualité et tests

on:
  push:
    # Vérifie chaque push sur une branche, quel que soit son nom.
    branches: ["**"]
  workflow_dispatch:

# Le workflow ne peut que lire le dépôt ; il n'a pas besoin d'écrire de contenu.
permissions:
  contents: read

# Si un nouveau push arrive sur la même branche, les vérifications précédentes,
# devenues obsolètes, sont annulées.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Qualité et tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Base PostgreSQL jetable, créée pour ce job et détruite à la fin. Son mot de
    # passe ne protège rien : il n'existe que le temps des tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: p5
          POSTGRES_USER: proprietaire
          POSTGRES_PASSWORD: base-jetable-de-ci
        ports:
          - 5432:5432
        # Le job attend que la base réponde avant de lancer les étapes.
        options: >-
          --health-cmd "pg_isready -U proprietaire -d p5"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Les tests tournent dans l'environnement « test », sur la base jetable.
    env:
      APP_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: p5
      POSTGRES_USER: proprietaire
      POSTGRES_PASSWORD: base-jetable-de-ci
      POSTGRES_API_USER: api
      POSTGRES_API_PASSWORD: role-api-jetable-de-ci

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # La version de Python est déduite des contraintes du pyproject.toml.
      - name: Installer uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Installer Python
        run: uv python install

      # --locked garantit que l'environnement correspond exactement à uv.lock.
      # --all-groups inclut notamment les dépendances de développement (Ruff, pytest).
      - name: Installer les dépendances
        run: uv sync --locked --all-groups

      - name: Vérifier Ruff
        run: uv run ruff check .

      - name: Vérifier le formatage
        run: uv run ruff format --check .

      # Les tests « lent » sont exclus car ils dépendent de données non versionnées
      # ou réentraînent le modèle. Les tests de l'API et de la base créent leur
      # propre base, p5_test, sur le service PostgreSQL ci-dessus.
      - name: Exécuter les tests
        run: uv run pytest -m "not lent" --cov=src

      # Vérifie aussi que le projet peut être empaqueté.
      - name: Vérifier la construction du paquet
        run: uv build
