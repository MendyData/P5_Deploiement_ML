# Intégration continue : à chaque push, je vérifie le style, le format, les tests
# et la construction du paquet. Le workflow de déploiement rappelle aussi ce
# workflow avant de construire l'image : rien n'est déployé si une vérification
# échoue.
name: CI - Qualité et tests

on:
  push:
    # Je vérifie chaque push, sur toutes les branches, quel que soit leur nom.
    branches: ["**"]
  # Le workflow de déploiement l'appelle avant de construire l'image.
  workflow_call:
  workflow_dispatch:

# Je ne donne au workflow que le droit de lire le dépôt.
permissions:
  contents: read

# Si je pousse à nouveau sur la même branche, j'annule les vérifications
# précédentes, devenues obsolètes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Qualité et tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Je crée une base PostgreSQL jetable pour ce job ; elle disparaît à la fin.
    # Son mot de passe ne protège rien : il n'existe que le temps des tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: p5
          POSTGRES_USER: proprietaire
          POSTGRES_PASSWORD: base-jetable-de-ci
        ports:
          - 5432:5432
        # J'attends que la base réponde avant de lancer les étapes.
        options: >-
          --health-cmd "pg_isready -U proprietaire -d p5"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Je lance les tests dans l'environnement « test », sur la base jetable.
    env:
      APP_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: p5
      POSTGRES_USER: proprietaire
      POSTGRES_PASSWORD: base-jetable-de-ci
      POSTGRES_API_USER: api
      POSTGRES_API_PASSWORD: role-api-jetable-de-ci

    steps:
      # Chaque action est épinglée par l'empreinte de son commit : son code ne
      # peut pas changer sans que je modifie ce fichier.
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # uv déduit la version de Python des contraintes du pyproject.toml.
      - name: Installer uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Installer Python
        run: uv python install

      # --locked garantit que l'environnement correspond exactement à uv.lock.
      # --all-groups inclut les dépendances de développement (Ruff, pytest).
      - name: Installer les dépendances
        run: uv sync --locked --all-groups

      - name: Vérifier Ruff
        run: uv run ruff check .

      - name: Vérifier le formatage
        run: uv run ruff format --check .

      # J'exclus les tests « lent » : ils dépendent de données non versionnées ou
      # réentraînent le modèle. Les tests de l'API et de la base créent leur
      # propre base, p5_test, sur le service PostgreSQL ci-dessus.
      - name: Exécuter les tests
        run: uv run pytest -m "not lent" --cov=src

      # Je vérifie aussi que le projet peut être empaqueté.
      - name: Vérifier la construction du paquet
        run: uv build
