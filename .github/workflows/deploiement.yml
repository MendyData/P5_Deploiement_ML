# Déploiement : je construis l'image, je démarre la base et l'API avec Docker
# Compose, puis je vérifie que l'API répond.
# - un push sur la branche staging utilise l'environnement GitHub « test » ;
# - un tag vX.Y.Z, posé sur production, utilise l'environnement « production ».
name: Déploiement

on:
  push:
    branches: [staging]
    tags: ["v*"]

# Je ne donne au workflow que le droit de lire le dépôt.
permissions:
  contents: read

jobs:
  image:
    name: Image Docker et test de fumée
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Je choisis l'environnement GitHub : « production » pour un tag, « test » sinon.
    # Ses variables et ses secrets sont déclarés dans Settings, Environments.
    environment: ${{ github.ref_type == 'tag' && 'production' || 'test' }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Docker Compose lit ses réglages dans un fichier .env. Je l'écris ici à
      # partir de la variable et des secrets de l'environnement GitHub : aucune
      # valeur sensible n'est écrite dans ce fichier YAML.
      - name: Écrire le fichier .env de l'environnement
        env:
          APP_ENV: ${{ vars.APP_ENV }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_API_PASSWORD: ${{ secrets.POSTGRES_API_PASSWORD }}
        run: |
          {
            echo "APP_ENV=$APP_ENV"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "POSTGRES_API_PASSWORD=$POSTGRES_API_PASSWORD"
          } > .env

      # Compose suit docker-compose.yml : image construite, base démarrée, tables
      # et rôle créés, API lancée. L'installation est automatisée de bout en bout.
      - name: Construire l'image et démarrer la base et l'API
        run: docker compose up --build --detach

      # Test de fumée : /health doit répondre, ce qui prouve que l'API, le modèle
      # et la base fonctionnent ensemble. curl réessaie pendant le démarrage.
      - name: Vérifier que l'API répond
        run: >-
          curl --fail --silent --show-error
          --retry 20 --retry-delay 3 --retry-all-errors
          http://localhost:8000/health

      # En cas d'échec, les journaux des conteneurs disent pourquoi.
      - name: Afficher les journaux
        if: always()
        run: docker compose logs
