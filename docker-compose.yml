# Lancement local de mon application avec une seule commande :
#     docker compose up --build
# Compose démarre la base, l'initialise, puis démarre l'API.
# Il lit le fichier .env placé à côté de ce fichier pour remplir les ${...} :
# ${VARIABLE:?message} arrête tout si la variable manque,
# ${VARIABLE:-valeur} donne une valeur quand elle est absente.

services:
  # 1. La base PostgreSQL. Son nom, « db », sert d'adresse aux autres services.
  db:
    image: postgres:16
    environment:
      # Au premier démarrage, l'image crée cette base et ce rôle propriétaire.
      POSTGRES_DB: ${POSTGRES_DB:-p5}
      POSTGRES_USER: ${POSTGRES_USER:-proprietaire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manque dans le fichier .env}
    ports:
      # 127.0.0.1 : la base n'est joignable que depuis mon poste, pour mes
      # scripts et mes tests.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Les données vivent dans un volume : elles survivent à l'arrêt du conteneur.
      - donnees_postgres:/var/lib/postgresql/data
    healthcheck:
      # Compose interroge la base toutes les 5 secondes jusqu'à ce qu'elle réponde.
      # Le double $ laisse la variable au conteneur au lieu de la lire dans .env.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 2. L'initialisation : elle crée les tables et le rôle de l'API, puis s'arrête.
  #    Relancée, elle ne modifie pas les données existantes.
  initialisation:
    build: .
    image: p5-deploiement-ml:local
    command: ["python", "scripts/creer_base.py"]
    depends_on:
      db:
        # J'attends que la base réponde, pas seulement que son conteneur existe.
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-p5}
      POSTGRES_USER: ${POSTGRES_USER:-proprietaire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manque dans le fichier .env}
      POSTGRES_API_USER: ${POSTGRES_API_USER:-api}
      POSTGRES_API_PASSWORD: ${POSTGRES_API_PASSWORD:?POSTGRES_API_PASSWORD manque dans le fichier .env}

  # 3. L'API. Elle ne reçoit que le rôle aux droits limités, jamais le
  #    mot de passe du propriétaire.
  api:
    image: p5-deploiement-ml:local
    depends_on:
      initialisation:
        # L'API ne démarre que si l'initialisation s'est terminée sans erreur.
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV manque dans le fichier .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-p5}
      POSTGRES_API_USER: ${POSTGRES_API_USER:-api}
      POSTGRES_API_PASSWORD: ${POSTGRES_API_PASSWORD:?POSTGRES_API_PASSWORD manque dans le fichier .env}

volumes:
  donnees_postgres:
