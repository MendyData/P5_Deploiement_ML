# Lancement local de mon application avec une seule commande :
#     docker compose up --build
# Compose construit l'image avec le Dockerfile, puis démarre le conteneur.
# Il lit le fichier .env placé à côté de ce fichier pour remplir les ${...}.

services:
  api:
    # Je construis l'image à partir du Dockerfile du dossier courant.
    build: .
    image: p5-deploiement-ml:local
    ports:
      # port de mon poste : port du conteneur. 127.0.0.1 : l'API n'est joignable
      # que depuis mon poste, sur http://localhost:8000.
      - "127.0.0.1:8000:8000"
    environment:
      # ${VARIABLE:?message} : Compose refuse de démarrer si la variable manque.
      APP_ENV: ${APP_ENV:?APP_ENV manque dans le fichier .env}
      API_KEY_HASH: ${API_KEY_HASH:?API_KEY_HASH manque dans le fichier .env}
      # ${VARIABLE:-valeur} : valeur utilisée quand la variable est absente.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
